<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Estrella, Barcelona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="weather" aria-label="Weather in Barcelona this week">
    <ul id="weather"><li class="muted">Loading the forecast…</li></ul>
  </section>

  <main>
    <h1>Hotel Estrella</h1>
    <p class="intro">Write to us about your stay. Our assistant answers from the hotel's policies, and a member of staff will reply by e-mail when needed.</p>

    <form id="form">
      <label for="name">Name</label>
      <input id="name" name="name" required autocomplete="name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">

      <label for="message">Please leave your message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <div class="buttons">
        <button type="submit" id="send">Send</button>
        <button type="button" id="clear" class="secondary">Clear</button>
      </div>
    </form>

    <div id="reply" class="reply" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
