<!doctype html>
<!-- WARNING: this page has no login yet. Anyone who can open /staff can read every guest request. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff: guest requests</title>
  <style>
    body { margin: 16px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1B2A41; background: #fff; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .filters button { font: inherit; padding: 4px 10px; margin-right: 4px; border: 1px solid #999; background: #fff; cursor: pointer; }
    .filters button.on { background: #1B2A41; color: #fff; }
    .wrap { overflow-x: auto; margin-top: 8px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f7f7f7; }
    tr.trace td { background: #fafafa; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; cursor: default; }
  </style>
</head>
<body>
  <h1>Guest requests</h1>
  <div class="filters">
    <button data-filter="ALL" class="on">All</button>
    <button data-filter="ESCALATED">Escalated</button>
    <button data-filter="ANSWERED">Answered</button>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr><th>Time</th><th>Name</th><th>Email</th><th>Message</th><th>Department</th><th>Urgency</th><th>Status</th><th>Reply</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    let requests = [];
    let filter = "ALL";

    // One line per trace entry.
    function traceLines(trace) {
      return (trace || []).map((t) => {
        if (t.type === "model") return `model step ${t.step}: stop_reason=${t.stop_reason}, asked_for_tool=${t.asked_for_tool}`;
        if (t.type === "tool") return `tool ${t.name} ${JSON.stringify(t.arguments)} -> ${t.result}`;
        if (t.type === "final") return `final: ${t.text.replace(/\s+/g, " ")}`;
        return JSON.stringify(t);
      }).join("\n");
    }

    function render() {
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      requests
        .filter((r) => filter === "ALL" || r.status === filter)
        .forEach((r) => {
          const tr = document.createElement("tr");
          const cells = [new Date(r.time).toLocaleString("en-GB"), r.name, r.email, r.message, r.department, r.urgency, r.status, r.reply];
          cells.forEach((value) => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
          });
          tr.addEventListener("click", () => {
            const next = tr.nextElementSibling;
            if (next && next.classList.contains("trace")) return next.remove();
            const traceRow = document.createElement("tr");
            traceRow.className = "trace";
            const td = document.createElement("td");
            td.colSpan = 8;
            td.textContent = (r.note ? `note: ${r.note}\n` : "") + traceLines(r.trace);
            traceRow.appendChild(td);
            tr.after(traceRow);
          });
          tbody.appendChild(tr);
        });
    }

    document.querySelectorAll(".filters button").forEach((b) => {
      b.addEventListener("click", () => {
        filter = b.dataset.filter;
        document.querySelectorAll(".filters button").forEach((x) => x.classList.toggle("on", x === b));
        render();
      });
    });

    fetch("/api/requests").then((r) => r.json()).then((data) => { requests = data; render(); });
  </script>
</body>
</html>
